name: ✨ Feature Request
description: Suggest a new feature or improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: use-case
    attributes:
      label: Use Case
      description: "What are you trying to do? What problem would this solve?"
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed Solution
      description: "How do you imagine this working?"
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: "Did you look at other tools or workarounds?"

  - type: dropdown
    id: scope
    attributes:
      label: Scope
      options:
        - Small (UI tweak, config option)
        - Medium (new feature in existing workflow)
        - Large (new subsystem, e.g. OCR, libcups3 migration)
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission checks
      options:
        - label: I searched existing issues and didn't find a duplicate
          required: true
        - label: This is within the scope of PrintEase (printer/scanner management on Linux)
          required: true
